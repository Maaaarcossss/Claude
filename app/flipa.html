<title>Flipa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna (máx. 520px). Arriba: marca + cronómetro y navegación segmentada fija. Abajo: barra de acciones Compra / Venta. Detalles y formularios en páginas a pantalla completa. Sin tarjetas: secciones separadas por espacio y filetes. */
:root{
  --bg:#ffffff; --bg-2:#f5f5f4; --fg:#0f0f10; --muted:#6c6c70; --faint:#a3a3a7; --line:#e8e8e6;
  --primary:#0f0f10; --primary-ink:#ffffff;
  --pos:#0d7a4e; --neg:#c33a32; --warn:#a6650b; --live:#d93a2f;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --bg-2:#161618; --fg:#f2f2f0; --muted:#9b9b9f; --faint:#626266; --line:#242427;
  --primary:#f2f2f0; --primary-ink:#0b0b0c; --pos:#4cc58c; --neg:#f2706a; --warn:#e3a547; --live:#ff5a4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --bg-2:#161618; --fg:#f2f2f0; --muted:#9b9b9f; --faint:#626266; --line:#242427;
  --primary:#f2f2f0; --primary-ink:#0b0b0c; --pos:#4cc58c; --neg:#f2706a; --warn:#e3a547; --live:#ff5a4f; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;padding-inline:20px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.label{font-size:13px;color:var(--muted)}
.h{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 10px}

/* Cabecera fija */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.bar{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:600;font-size:18px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:2px;background:var(--fg);display:inline-block;transform:rotate(45deg)}
.clockchip{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;transition:border-color .2s}
.clockchip svg{width:15px;height:15px}
.clockchip.on{border-color:color-mix(in srgb,var(--live) 45%,var(--line))}
.clockchip .dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s ease-in-out infinite}
.seg{display:grid;grid-template-columns:repeat(4,1fr);position:relative;border-bottom:1px solid var(--line)}
.seg button{height:42px;font-size:14px;font-weight:500;color:var(--muted);transition:color .2s}
.seg button[aria-selected="true"]{color:var(--fg)}
.seg .ind{position:absolute;bottom:-1px;left:0;height:2px;width:25%;background:var(--fg);transition:transform .35s var(--ease)}

main{padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:36px;animation:enter .35s var(--ease) both}
.example{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);padding:10px 12px;background:var(--bg-2);border-radius:10px}
.link{font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.link.danger{color:var(--neg)}

/* Resumen */
.month{display:flex;align-items:center;gap:4px;margin-bottom:18px}
.month button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.month button:hover:not(:disabled){background:var(--bg-2);color:var(--fg)}
.month button:disabled{opacity:.3;cursor:default}
.month span{font-weight:500;min-width:128px;text-align:center}
.big{font-family:var(--sans);font-size:clamp(48px,14vw,64px);font-weight:500;letter-spacing:-.05em;line-height:1;margin-block:6px 10px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:22px}
.kpis>div{padding:14px 0 14px 14px;border-left:1px solid var(--line);min-width:0}
.kpis>div:first-child{border-left:0;padding-left:0}
.kpis .v{font-size:20px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s var(--ease) forwards}
.chart .pt{cursor:pointer}
.chart text{font-family:var(--sans)}

.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.r{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .15s}
button.r:hover{background:linear-gradient(90deg,transparent,var(--bg-2) 20%,var(--bg-2) 80%,transparent)}
.r.thumbed{grid-template-columns:40px 1fr auto}
.r>span{min-width:0}
.r .t{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:13px;color:var(--muted);display:block}
.r .amt{text-align:right;font-weight:500}
.r .amt small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.thumb{width:40px;height:40px;border-radius:10px;background:var(--bg-2);display:grid;place-items:center;font-weight:500;color:var(--muted);overflow:hidden;font-size:15px}
.thumb img{width:100%;height:100%;object-fit:cover}
.st{display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--faint)}
.st.publicado::before{border-color:var(--fg)}
.st.vendido::before{background:var(--pos);border-color:var(--pos)}
.warn{color:var(--warn)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:right;padding:0 0 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:12px 0;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td.num{font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two .v{font-size:22px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Inventario */
.search{width:100%;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 14px;font:inherit;color:var(--fg)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pillbtn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);transition:all .2s}
.pillbtn[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.pillbtn .c{opacity:.6;margin-left:4px;font-family:var(--mono);font-size:12px}

/* Fiscal */
.meter{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.meter .k{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter .k b{color:var(--fg);font-weight:500}
.line{height:4px;background:var(--bg-2);border-radius:4px;overflow:hidden}
.line i{display:block;height:100%;border-radius:4px;background:var(--fg);transform-origin:left;animation:grow .9s var(--ease) both}
.line i.w{background:var(--warn)} .line i.n{background:var(--neg)}
.platblock{padding-block:16px;border-bottom:1px solid var(--line)}
.platblock:first-child{border-top:1px solid var(--line)}
.platblock .hd{display:flex;justify-content:space-between;align-items:baseline}
.platblock .hd b{font-weight:500}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.55}

/* Barra de acciones */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.actionbar .wrap{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{height:50px;border-radius:12px;font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--bg);transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--neg)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Páginas a pantalla completa */
.page{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:slideIn .32s var(--ease) both;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.page.out{animation:slideOut .25s var(--ease) both}
.page .pbar{height:56px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);flex:none}
.page .pbar .wrap{display:flex;align-items:center;gap:8px;width:100%}
.back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-left:-8px}
.back:hover{background:var(--bg-2)}
.back svg{width:20px;height:20px}
.page .ptitle{font-weight:500}
.page .pbody{flex:1;overflow:auto;padding-block:24px}
.page .pbody .wrap{display:flex;flex-direction:column;gap:28px}
.page .pfoot{flex:none;border-top:1px solid var(--line);padding-block:12px}
.page .pfoot .wrap{display:flex;gap:10px}
.page .pfoot .btn{flex:1}

.form{display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.field>.lab{font-size:13px;color:var(--muted);font-weight:500}
.field input{height:46px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;font:inherit;color:var(--fg);width:100%;min-width:0}
.field input[type=number]{font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.photo{display:flex;align-items:center;gap:14px}
.photo .thumb{width:56px;height:56px;border-radius:12px;border:1px dashed var(--faint);background:none}
.photo label{font-size:14px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.result{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;border-top:1px solid var(--line)}
.result .v{font-size:30px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .2s}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.timeline div{border-top:2px solid var(--line);padding-top:8px;font-size:13px}
.timeline div.on{border-color:var(--fg)}
.timeline b{display:block;font-weight:500}
.timeline span{color:var(--muted);font-size:12px}
.kvs{display:flex;flex-direction:column}
.kvs .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kvs .kv span:first-child{color:var(--muted)}
.kvs .kv.total{font-weight:600;font-size:16px;border-bottom:0}
.kvs .kv.total span:first-child{color:var(--fg)}
.clockbig{font-family:var(--mono);font-size:56px;font-weight:400;letter-spacing:-.04em;text-align:center;padding-block:20px}
textarea{width:100%;min-height:220px;border:1px solid var(--line);background:var(--bg-2);border-radius:10px;padding:12px;font-family:var(--mono);font-size:11px;color:var(--fg)}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 40px);animation:toast .35s var(--ease) both;white-space:nowrap}
.toast svg{width:18px;height:18px;flex:none}
.toast svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:tick .4s .15s var(--ease) forwards}

@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideOut{to{transform:translateX(100%)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{50%{opacity:.25}}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tick{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><i aria-hidden="true"></i>Flipa</div>
      <button type="button" class="clockchip" id="clockChip"></button>
    </div>
    <nav class="seg" id="seg" role="tablist" aria-label="Secciones">
      <button type="button" role="tab" data-v="resumen">Resumen</button>
      <button type="button" role="tab" data-v="inventario">Inventario</button>
      <button type="button" role="tab" data-v="gastos">Gastos</button>
      <button type="button" role="tab" data-v="fiscal">Fiscal</button>
      <span class="ind" id="ind"></span>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="actionbar">
  <div class="wrap">
    <button type="button" class="btn" id="buyBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Compra</button>
    <button type="button" class="btn primary" id="sellBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Registrar venta</button>
  </div>
</div>
<div id="pageRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
const KEY="flipa-v1",DAY=864e5;
const $=s=>document.querySelector(s);
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=new Date();today.setHours(0,0,0,0);
const iso=t=>{const x=new Date(t);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const ago=n=>iso(today.getTime()-n*DAY);
const toDate=s=>new Date(s+"T00:00:00");
const days=(a,b)=>Math.round((toDate(b)-toDate(a))/DAY);
const r2=n=>Math.round(n*100)/100;
const eur=n=>{n=r2(n);return n.toLocaleString("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2,useGrouping:"always"})};
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const uid=()=>Math.random().toString(36).slice(2,10);
const short=d=>toDate(d).toLocaleDateString("es-ES",{day:"numeric",month:"short"}).replace(".","");
const CATS=["Ropa","Zapatillas","Electrónica","Accesorios","Libros","Juguetes","Hogar","Otros"];
const PLACES=["Rastro","Mercadillo","Tienda solidaria","Vinted","Wallapop","Mi armario","Otro"];
const PLATS=["Vinted","Wallapop","Otra"];
const GCATS=["Transporte","Embalaje","Destacados","Suscripciones","Otros"];
const ACTS=["Rastro","Fotos y anuncios","Envíos"];
const STATUS={stock:"En stock",publicado:"Publicado",vendido:"Vendido"};
const ICO={
  back:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  prev:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  next:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  ok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* ---------- Datos de ejemplo ---------- */
function sample(){
  const items=[];
  const mk=(name,cat,buy,place,bAgo,extra,min,target,status,plat,lAgo,sale)=>items.push({id:uid(),name,cat,buy,place,buyDate:ago(bAgo),extra,min,target,status,platform:plat,listed:lAgo!=null?ago(lAgo):null,
    sale:sale?{price:sale[0],date:ago(sale[1]),ship:sale[2],fees:sale[3],pack:sale[4]}:null,photo:null});
  mk("Vaqueros Levi's 501 vintage","Ropa",6,"Rastro",150,0,25,35,"vendido","Vinted",146,[32,140,0,0,.5]);
  mk("Nike Air Max 90","Zapatillas",25,"Wallapop",120,4,40,75,"vendido","Wallapop",116,[70,100,3.5,0,1]);
  mk("Chaqueta Barbour encerada","Ropa",15,"Tienda solidaria",95,6,45,90,"vendido","Vinted",92,[85,60,0,0,1]);
  mk("Nintendo DS Lite + 3 juegos","Electrónica",20,"Rastro",80,0,35,60,"vendido","Wallapop",78,[55,70,4,0,1.5]);
  mk("Sudadera Carhartt","Ropa",8,"Rastro",60,0,20,30,"vendido","Vinted",58,[30,45,0,0,.5]);
  mk("Cámara Polaroid 600","Electrónica",12,"Rastro",55,8,50,50,"vendido","Wallapop",50,[48,20,4,0,2]);
  mk("Lote libros Harry Potter","Libros",5,"Mercadillo",50,0,25,25,"vendido","Vinted",48,[22,30,0,0,1]);
  mk("Adidas Samba","Zapatillas",30,"Vinted",40,3,30,65,"vendido","Vinted",37,[62,18,0,0,1]);
  mk("Camisetas básicas (x3)","Ropa",3,"Mi armario",35,0,15,10,"vendido","Vinted",34,[9,10,0,0,.5]);
  mk("Walkman Sony","Electrónica",10,"Rastro",30,0,30,45,"vendido","Wallapop",28,[45,6,4,0,1.5]);
  mk("Bolso de piel vintage","Accesorios",18,"Tienda solidaria",25,0,25,60,"vendido","Vinted",22,[55,4,0,0,1]);
  mk("Abrigo de lana","Ropa",10,"Rastro",75,0,20,45,"publicado","Vinted",70,null);
  mk("Puma Suede","Zapatillas",15,"Wallapop",45,2,15,40,"publicado","Wallapop",40,null);
  mk("Lote Lego clásico","Juguetes",18,"Rastro",34,0,40,55,"publicado","Vinted",30,null);
  mk("Game Boy Color","Electrónica",25,"Rastro",12,0,20,70,"publicado","Wallapop",10,null);
  mk("Gafas de sol vintage","Accesorios",20,"Mercadillo",8,0,5,45,"stock",null,null,null);
  mk("Chaqueta vaquera Lee","Ropa",7,"Rastro",3,0,5,35,"stock",null,null,null);
  const ex=(concept,cat,eur,a)=>({id:uid(),concept,cat,eur,date:ago(a)});
  const expenses=[ex("Gasolina rastro","Transporte",12,150),ex("Cajas de envío (x20)","Embalaje",9,130),ex("Gasolina rastro","Transporte",12,95),
    ex("Destacado Wallapop","Destacados",2.99,72),ex("Bolsas y celo","Embalaje",6,60),ex("Gasolina rastro","Transporte",14,52),
    ex("Gasolina rastro","Transporte",12,30),ex("Destacado Wallapop","Destacados",2.99,9),ex("Gasolina rastro","Transporte",12,5)];
  const ses=(label,min,a)=>({id:uid(),label,min,date:ago(a)});
  const sessions=[ses("Rastro",180,150),ses("Fotos y anuncios",90,128),ses("Rastro",150,95),ses("Envíos",60,70),ses("Rastro",200,52),
    ses("Fotos y anuncios",80,33),ses("Rastro",150,5),ses("Fotos y anuncios",60,3)];
  return {items,expenses,sessions,timer:null,example:true};
}
let S;

if(!S)S=sample();

/* ---------- Cálculos ---------- */
const cost=it=>it.buy+(it.extra||0);
const saleCosts=it=>it.sale?(it.sale.ship+it.sale.fees+it.sale.pack):0;
const profit=it=>it.sale?it.sale.price-cost(it)-saleCosts(it):0;
const sold=()=>S.items.filter(i=>i.status==="vendido"&&i.sale);
const live=()=>S.items.filter(i=>i.status!=="vendido");
const inMonth=(d,y,m)=>{const x=toDate(d);return x.getFullYear()===y&&x.getMonth()===m};
const inYear=(d,y)=>toDate(d).getFullYear()===y;
const idleDays=it=>days(it.listed||it.buyDate,iso(today));
function month(y,m){
  const s=sold().filter(i=>inMonth(i.sale.date,y,m));
  const exp=S.expenses.filter(e=>inMonth(e.date,y,m)).reduce((a,e)=>a+e.eur,0);
  const min=s.reduce((a,i)=>a+(i.min||0),0)+S.sessions.filter(x=>inMonth(x.date,y,m)).reduce((a,x)=>a+x.min,0);
  const revenue=s.reduce((a,i)=>a+i.sale.price,0),gross=s.reduce((a,i)=>a+profit(i),0);
  return {s,net:gross-exp,gross,exp,min,revenue};
}
const perHour=(net,min)=>min>0?net/(min/60):0;
const hm=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return h?h+" h"+(m?" "+m+" min":""):m+" min"};

/* Número animado */
const shown={};
function countTo(el,key,to,fmt){
  const from=key in shown?shown[key]:to*.6;shown[key]=to;
  if(RM||from===to){el.textContent=fmt(to);return}
  const t0=performance.now(),d=700;
  const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
  el.textContent=fmt(from);requestAnimationFrame(step);
}

function drawChart(){
  const pts=[];for(let k=5;k>=0;k--){const d=new Date(sel.y,sel.m-k,1);pts.push({y:d.getFullYear(),m:d.getMonth(),l:d.toLocaleDateString("es-ES",{month:"short"}).replace(".",""),v:month(d.getFullYear(),d.getMonth()).net})}
  const W=480,H=170,top=28,bot=28,pad=18;
  const mx=Math.max(1,...pts.map(p=>p.v)),mn=Math.min(0,...pts.map(p=>p.v));
  const X=i=>pad+i*(W-2*pad)/5,Y=v=>top+(mx-v)/(mx-mn||1)*(H-top-bot);
  const path=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  let len=0;for(let i=1;i<6;i++)len+=Math.hypot(X(i)-X(i-1),Y(pts[i].v)-Y(pts[i-1].v));
  let g=`<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1"/>`;
  g+=`<path d="${path} L${X(5)} ${Y(mn)} L${X(0)} ${Y(mn)} Z" fill="var(--fg)" opacity=".04"/>`;
  g+=`<path class="ln" d="${path}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-linejoin="round" style="--len:${Math.ceil(len)}"/>`;
  pts.forEach((p,i)=>{const on=i===5;
    g+=`<g class="pt" data-y="${p.y}" data-m="${p.m}"><rect x="${X(i)-30}" y="0" width="60" height="${H}" fill="transparent"/>`+
      `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${on?5:3}" fill="${on?"var(--fg)":"var(--bg)"}" stroke="var(--fg)" stroke-width="1.6"/>`+
      `<text x="${X(i)}" y="${Y(p.v)-12}" text-anchor="middle" font-size="12" font-weight="${on?600:400}" fill="${on?"var(--fg)":"var(--muted)"}">${Math.round(p.v)} €</text>`+
      `<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="12" fill="${on?"var(--fg)":"var(--muted)"}" font-weight="${on?500:400}">${p.l}</text></g>`});
  $("#chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Beneficio neto de los últimos 6 meses. Toca un mes para verlo.">${g}</svg>`;
}

function page(title,body,foot,bind){
  const root=$("#pageRoot");
  const el=document.createElement("div");el.className="page";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label",title);
  el.innerHTML=`<div class="pbar"><div class="wrap"><button type="button" class="back" data-back aria-label="Volver">${ICO.back}</button><span class="ptitle">${esc(title)}</span></div></div>
    <div class="pbody"><div class="wrap">${body}</div></div>${foot?`<div class="pfoot"><div class="wrap">${foot}</div></div>`:""}`;
  root.appendChild(el);
  const close=(cb)=>{document.removeEventListener("keydown",onKey);if(RM){el.remove();cb&&cb();return}el.classList.add("out");el.addEventListener("animationend",()=>{el.remove();cb&&cb()},{once:true})};
  const onKey=e=>{if(e.key==="Escape"&&root.lastChild===el)close()};
  document.addEventListener("keydown",onKey);
  el.addEventListener("click",e=>{if(e.target.closest("[data-back]"))close()});
  bind&&bind(el,close);
  const f=el.querySelector(".pbody input:not([type=file]):not([type=search])");if(f&&!f.value)setTimeout(()=>f.focus({preventScroll:true}),350);
  return el;
}

function pick(el,id){const box=el.querySelector("#"+id);box.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});return ()=>{const b=box.querySelector('[aria-pressed="true"]');return b?b.dataset.v:null}}
let tt;function toast(t,ok){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${ok?ICO.ok:""}<span>${esc(t)}</span></div>`;clearTimeout(tt);tt=setTimeout(()=>r.innerHTML="",2400)}

    <div class="grid2">
      <div class="field"><label for="sPrice">Precio de venta</label><input id="sPrice" type="number" inputmode="decimal" min="0" step="0.01" value="${it.target||""}" placeholder="0,00 €"></div>
      <div class="field"><label for="sDate">Fecha</label><input id="sDate" type="date" value="${iso(today)}"></div>
    </div>
    <div class="field"><span class="lab">Plataforma</span>${opts("sPlat",PLATS,it.platform||"Vinted")}</div>
    <div class="grid3">
      <div class="field"><label for="sShip">Envío</label><input id="sShip" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>
      <div class="field"><label for="sFees">Comisiones</label><input id="sFees" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>
      <div class="field"><label for="sPack">Embalaje</label><input id="sPack" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>
    </div>
    <p class="note">Incluye solo lo que pagas tú. Si el comprador paga el envío, déjalo en 0.</p>
    <div class="result"><span class="label">Beneficio real</span><span class="v" id="sProfit"></span></div>
  </div>`,`<button type="button" class="btn primary" id="sSave">Guardar venta</button>`,(el,close)=>{
    const plat=pick(el,"sPlat"),v=id=>num(el.querySelector(id).value);
    const calc=()=>{const p=v("#sPrice")-cost(it)-v("#sShip")-v("#sFees")-v("#sPack");const o=el.querySelector("#sProfit");o.textContent=eur(p);o.className="v "+(p>=0?"pos":"neg");return p};
    el.addEventListener("input",calc);calc();
    el.querySelector("#sSave").addEventListener("click",()=>{
      if(v("#sPrice")<=0){el.querySelector("#sPrice").focus();toast("Escribe el precio de venta");return}
      const p=calc();
      it.status="vendido";it.platform=plat();it.listed=it.listed||it.buyDate;
      it.sale={price:v("#sPrice"),date:el.querySelector("#sDate").value||iso(today),ship:v("#sShip"),fees:v("#sFees"),pack:v("#sPack")};
      S.example=false;save();
      close(()=>{onDone&&onDone();sel={y:today.getFullYear(),m:today.getMonth()};setView("resumen")});
      toast("Venta registrada · "+(p>=0?"+":"")+eur(p),true);
    });
  });
}

/* Ficha de producto */
function openItem(id){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  const isSold=it.status==="vendido",p=profit(it);
  const steps=[["Comprado",it.buyDate,true],["Publicado",it.listed,it.status!=="stock"],["Vendido",it.sale&&it.sale.date,isSold]];
  const body=`<div style="display:flex;gap:14px;align-items:center">${thumb(it)}<div style="min-width:0"><div style="font-size:20px;font-weight:500;letter-spacing:-.02em">${esc(it.name)}</div><div class="label">${esc(it.cat)} · comprado en ${esc(it.place||"–")}</div></div></div>
    <div class="timeline">${steps.map(([l,d,on])=>`<div class="${on?"on":""}"><b>${l}</b><span>${on&&d?short(d):"—"}</span></div>`).join("")}</div>
    <div class="kvs">
      <div class="kv"><span>Precio de compra</span><span class="num">${eur(it.buy)}</span></div>
      ${it.extra?`<div class="kv"><span>Limpieza o arreglo</span><span class="num">${eur(it.extra)}</span></div>`:""}
      ${isSold?`<div class="kv"><span>Precio de venta · ${esc(it.platform)}</span><span class="num">${eur(it.sale.price)}</span></div>
        ${saleCosts(it)?`<div class="kv"><span>Envío, comisiones y embalaje</span><span class="num">−${eur(saleCosts(it))}</span></div>`:""}
        <div class="kv total"><span>Beneficio real</span><span class="num ${p>=0?"pos":"neg"}">${eur(p)}</span></div>
        ${it.min?`<div class="kv"><span>Por hora dedicada</span><span class="num">${eur(perHour(p,it.min))}</span></div>`:""}`
      :`<div class="kv"><span>Precio objetivo</span><span class="num">${eur(it.target||0)}</span></div><div class="kv"><span>Días sin vender</span><span class="num ${idleDays(it)>=30?"warn":""}">${idleDays(it)}</span></div>`}
    </div>
    <div class="field"><span class="lab">Tiempo dedicado · <span class="num" id="iMin">${hm(it.min||0)}</span></span>
      <div class="opts" id="iTime"><button type="button" class="pillbtn" data-m="5">+5 min</button><button type="button" class="pillbtn" data-m="15">+15 min</button><button type="button" class="pillbtn" data-m="30">+30 min</button><button type="button" class="pillbtn" data-m="0">Reiniciar</button></div></div>
    ${it.status==="stock"?`<div class="field"><span class="lab">Plataforma para publicar</span>${opts("iPlat",PLATS,"Vinted")}</div>`:""}
    <div><button type="button" class="link danger" id="iDel">Eliminar producto</button></div>`;
  const foot=it.status==="stock"?`<button type="button" class="btn" id="iPublish">Marcar publicado</button><button type="button" class="btn primary" id="iSell">Registrar venta</button>`
    :it.status==="publicado"?`<button type="button" class="btn" id="iUnpub">Retirar anuncio</button><button type="button" class="btn primary" id="iSell">Registrar venta</button>`
    :`<button type="button" class="btn" id="iReturn">Marcar como devuelto</button>`;
  page("Producto",body,foot,(el,close)=>{
    const done=msg=>{save();close(render);if(msg)toast(msg,true)};
    el.querySelector("#iTime").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;const m=+b.dataset.m;it.min=m?(it.min||0)+m:0;S.example=false;save();el.querySelector("#iMin").textContent=hm(it.min);render()});
    const q=s=>el.querySelector(s);
    if(q("#iPublish")){const plat=pick(el,"iPlat");q("#iPublish").addEventListener("click",()=>{it.status="publicado";it.platform=plat();it.listed=iso(today);S.example=false;done("Publicado en "+it.platform)})}
    if(q("#iSell"))q("#iSell").addEventListener("click",()=>openSell(it,()=>close()));
    if(q("#iUnpub"))q("#iUnpub").addEventListener("click",()=>{it.status="stock";it.platform=null;it.listed=null;done("Anuncio retirado")});
    if(q("#iReturn"))q("#iReturn").addEventListener("click",()=>{it.status="stock";it.sale=null;it.listed=null;it.platform=null;done("Devuelto al inventario")});
    const del=q("#iDel");del.addEventListener("click",()=>{if(del.dataset.armed){S.items=S.items.filter(i=>i!==it);done("Producto eliminado")}else{del.dataset.armed="1";del.textContent="Confirmar: eliminar definitivamente"}});
  });
}

/* Gasto */
function openExpense(){
  page("Nuevo gasto",`<div class="form">
    <div class="field"><label for="gConcept">Concepto</label><input id="gConcept" type="text" placeholder="Gasolina rastro"></div>
    <div class="grid2">
      <div class="field"><label for="gAmount">Importe</label><input id="gAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00 €"></div>
      <div class="field"><label for="gDate">Fecha</label><input id="gDate" type="date" value="${iso(today)}"></div>
    </div>
    <div class="field"><span class="lab">Tipo</span>${opts("gCat",GCATS,"Transporte")}</div>
    <p class="note">Para lo que no es de un producto concreto: gasolina, cajas, destacados, suscripciones.</p></div>`,
  `<button type="button" class="btn primary" id="gSave">Guardar gasto</button>`,(el,close)=>{
    const cat=pick(el,"gCat");
    el.querySelector("#gSave").addEventListener("click",()=>{
      const c=el.querySelector("#gConcept").value.trim(),a=num(el.querySelector("#gAmount").value);
      if(!c){el.querySelector("#gConcept").focus();toast("Escribe el concepto");return}
      if(a<=0){el.querySelector("#gAmount").focus();toast("Escribe el importe");return}
      S.expenses.push({id:uid(),concept:c,cat:cat(),eur:a,date:el.querySelector("#gDate").value||iso(today)});
      S.example=false;save();close(render);toast("Gasto guardado",true);
    });
  });
}

/* Cronómetro */
let clockTick;
const fmtClock=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function renderClock(){
  const c=$("#clockChip");clearInterval(clockTick);
  if(S.timer){c.classList.add("on");c.setAttribute("aria-label","Cronómetro en marcha. Abrir");
    const upd=()=>{c.innerHTML=`<span class="dot"></span><span class="num">${fmtClock(Date.now()-S.timer.start)}</span>`;const b=document.getElementById("clockBig");if(b)b.textContent=fmtClock(Date.now()-S.timer.start)};
    upd();clockTick=setInterval(upd,1000);
  }else{c.classList.remove("on");c.setAttribute("aria-label","Abrir cronómetro");c.innerHTML=`${ICO.clock}<span>Cronómetro</span>`}
}
function openTimer(){
  const y=today.getFullYear(),m=today.getMonth();
  const recent=S.sessions.filter(s=>inMonth(s.date,y,m)).sort((a,b)=>b.date.localeCompare(a.date));
  const running=!!S.timer;
  page("Cronómetro",`<div class="clockbig num" id="clockBig">${running?fmtClock(Date.now()-S.timer.start):"00:00:00"}</div>
    ${running?`<p class="note" style="text-align:center">Midiendo: <b>${esc(S.timer.label)}</b></p>`:`<div class="field"><span class="lab">Actividad</span>${opts("tAct",ACTS,"Rastro")}</div>`}
    <p class="note">Este tiempo se suma a tu ganancia por hora del mes.</p>
    <section><p class="h">Este mes · ${hm(recent.reduce((a,s)=>a+s.min,0))}</p>${recent.length?`<div class="rows">${recent.map(s=>`<div class="r"><span><span class="t">${esc(s.label)}</span><span class="s">${short(s.date)}</span></span><span class="amt num">${hm(s.min)}</span></div>`).join("")}</div>`:`<p class="note">Aún no has medido tiempo este mes.</p>`}</section>`,
  running?`<button type="button" class="btn primary" id="tStop">Parar y guardar</button>`:`<button type="button" class="btn primary" id="tStart">Empezar</button>`,(el,close)=>{
    if(running){el.querySelector("#tStop").addEventListener("click",()=>{const min=Math.max(1,Math.round((Date.now()-S.timer.start)/60000));S.sessions.push({id:uid(),label:S.timer.label,min,date:iso(today)});S.timer=null;S.example=false;save();close(render);toast(hm(min)+" guardados",true)})}
    else{const act=pick(el,"tAct");el.querySelector("#tStart").addEventListener("click",()=>{S.timer={start:Date.now(),label:act()};save();close(render);toast("Cronómetro en marcha",true)})}
  });
}

/* Exportar */
function csv(){
  const q=v=>{v=v==null?"":String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const dec=n=>n==null?"":String(r2(n)).replace(".",",");
  const rows=[["Producto","Categoría","Estado","Plataforma","Comprado en","Fecha compra","Precio compra","Limpieza/arreglo","Fecha venta","Precio venta","Envío","Comisiones","Embalaje","Beneficio","Minutos"]];
  S.items.forEach(i=>rows.push([i.name,i.cat,STATUS[i.status],i.platform||"",i.place||"",i.buyDate,dec(i.buy),dec(i.extra||0),i.sale?i.sale.date:"",i.sale?dec(i.sale.price):"",i.sale?dec(i.sale.ship):"",i.sale?dec(i.sale.fees):"",i.sale?dec(i.sale.pack):"",i.sale?dec(profit(i)):"",i.min||0]));
  rows.push([]);rows.push(["Gasto general","Tipo","Fecha","Importe"]);
  S.expenses.forEach(e=>rows.push([e.concept,e.cat,e.date,dec(e.eur)]));
  return rows.map(r=>r.map(q).join(";")).join("\n");
}
function openExport(){
  page("Exportar",`<p class="note">Copia el texto y pégalo en Excel, Google Sheets o un archivo .csv.</p><textarea id="csvBox" readonly aria-label="Datos en CSV">${esc(csv())}</textarea>`,
  `<button type="button" class="btn primary" id="copyCsv">Copiar</button>`,(el)=>{
    el.querySelector("#copyCsv").addEventListener("click",()=>{const ta=el.querySelector("#csvBox");const fb=()=>{ta.focus();ta.select();toast("Texto seleccionado. Cópialo desde el menú")};try{navigator.clipboard.writeText(ta.value).then(()=>toast("Copiado",true),fb)}catch(e){fb()}});
  });
}

/* ---------- Eventos ---------- */
$("#seg").addEventListener("click",e=>{const b=e.target.closest("[role=tab]");if(b&&b.dataset.v!==view)setView(b.dataset.v)});
$("#buyBtn").addEventListener("click",openBuy);
$("#sellBtn").addEventListener("click",openSellPicker);
$("#clockChip").addEventListener("click",openTimer);
$("#main").addEventListener("click",e=>{
  const it=e.target.closest("[data-item]");if(it){openItem(it.dataset.item);return}
  const f=e.target.closest("[data-filter]");if(f){filter=f.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.setAttribute("aria-pressed",String(x===f)));$("#invList").innerHTML=invList();return}
  const d=e.target.closest("[data-delexp]");if(d){if(d.dataset.armed){S.expenses=S.expenses.filter(x=>x.id!==d.dataset.delexp);save();render();toast("Gasto eliminado",true)}else{d.dataset.armed="1";d.textContent="Confirmar"}return}
  if(e.target.closest("#addExp")){openExpense();return}
  if(e.target.closest("#exportBtn")){openExport();return}
  if(e.target.closest("#mPrev")){sel=sel.m===0?{y:sel.y-1,m:11}:{y:sel.y,m:sel.m-1};render();return}
  if(e.target.closest("#mNext")){sel=sel.m===11?{y:sel.y+1,m:0}:{y:sel.y,m:sel.m+1};render();return}
  const pt=e.target.closest(".pt");if(pt){sel={y:+pt.dataset.y,m:+pt.dataset.m};render();return}
  const cl=e.target.closest("#clearBtn");if(cl){if(cl.dataset.armed){S={items:[],expenses:[],sessions:[],timer:null,example:false};save();render();toast("Ejemplo borrado",true)}else{cl.dataset.armed="1";cl.textContent="Confirmar borrado"}return}
});
setView(view);
})();
</script>
