<title>Flipa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Concepto "old money": papel color arena, terracota como color de marca, serif clásica para cifras y titulares, versalitas espaciadas, filetes finos dorados. Una columna (máx. 520px). Inicio con acciones grandes; barra inferior con 4 secciones. */
:root{
  --bg:#f7f1e6; --paper:#fffaf2; --sand:#eadcc4; --sand-2:#f1e6d3; --line:#e2d3bb; --gold:#b3955c;
  --terra:#b5573a; --terra-dk:#94432b; --terra-ink:#fff8ee;
  --fg:#2b211c; --muted:#7b6b5d; --faint:#a8998a;
  --pos:#55683a; --neg:#8f2d2a; --warn:#a8691c;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Jost",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sh:0 1px 0 rgba(43,33,28,.04),0 10px 30px -12px rgba(94,60,36,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1512; --paper:#241c18; --sand:#3a2e25; --sand-2:#2d241e; --line:#3b3029; --gold:#c4a66c;
  --terra:#d2734f; --terra-dk:#e08a68; --terra-ink:#1b1512;
  --fg:#f2e8d9; --muted:#b5a48f; --faint:#7d6e60;
  --pos:#a3b97a; --neg:#e07a6f; --warn:#e2a456;
  --sh:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1512; --paper:#241c18; --sand:#3a2e25; --sand-2:#2d241e; --line:#3b3029; --gold:#c4a66c;
  --terra:#d2734f; --terra-dk:#e08a68; --terra-ink:#1b1512;
  --fg:#f2e8d9; --muted:#b5a48f; --faint:#7d6e60;
  --pos:#a3b97a; --neg:#e07a6f; --warn:#e2a456;
  --sh:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.5); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--terra);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;padding-inline:20px}
.num{font-variant-numeric:tabular-nums lining-nums}
.serif{font-family:var(--serif)}
.sc{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
h2{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.1;margin:0;letter-spacing:-.005em;text-wrap:balance}
.note{font-size:13.5px;color:var(--muted);margin:0;line-height:1.55}

/* Cabecera */
header.top{padding-block:18px 6px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:12px}
.mono{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;position:relative;flex:none}
.mono::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid var(--gold);opacity:.6}
.mono span{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;color:var(--terra);line-height:1}
.mark .n{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1;letter-spacing:.01em}
.mark .d{font-size:12.5px;color:var(--muted)}
.timerpill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--terra);color:var(--terra-ink);font-size:13px;font-weight:500}
.timerpill i{width:7px;height:7px;border-radius:50%;background:var(--terra-ink);animation:pulse 1.4s ease-in-out infinite}

main{padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:30px}
.view>*{animation:enter .5s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.rule{display:flex;align-items:center;gap:12px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--line)}
.rule span{font-size:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sechead .link{font-size:13.5px;color:var(--terra);font-weight:500}

/* Hero */
.hero{background:var(--terra);color:var(--terra-ink);border-radius:18px;padding:24px 22px 20px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--terra-ink) 28%,transparent);border-radius:12px;pointer-events:none}
.hero .sc{color:var(--terra-ink);opacity:.8}
.hero .big{font-family:var(--serif);font-weight:600;font-size:clamp(54px,16vw,72px);line-height:1;margin-block:8px 6px;letter-spacing:-.01em}
.hero .line{font-family:var(--serif);font-style:italic;font-size:20px;opacity:.95}
.hero .facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--terra-ink) 25%,transparent)}
.hero .facts div{min-width:0}
.hero .facts b{display:block;font-weight:500;font-size:16px}
.hero .facts span{font-size:12px;opacity:.8}

/* Acciones de inicio */
.actions4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px;transition:transform .2s var(--ease),border-color .2s,background .2s;box-shadow:var(--sh)}
.act:hover{border-color:var(--gold)}
.act:active{transform:scale(.97)}
.act .ic{width:40px;height:40px;border-radius:50%;background:var(--sand);display:grid;place-items:center;color:var(--terra)}
.act .ic svg{width:21px;height:21px}
.act b{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1}
.act span{font-size:13px;color:var(--muted);line-height:1.35}
.act.main{background:var(--sand);border-color:var(--sand)}
.act.main .ic{background:var(--terra);color:var(--terra-ink)}
.act.on{border-color:var(--terra)}

/* Filas */
.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding-inline:14px;box-shadow:var(--sh)}
.r{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.r:last-child{border-bottom:0}
.r.plain{grid-template-columns:1fr auto}
.r>span{min-width:0}
.r .t{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:13px;color:var(--muted);display:block}
.r .amt{text-align:right;font-weight:500;white-space:nowrap}
.r .amt small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--sand);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:20px;color:var(--terra);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.qbtn{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:500;background:var(--terra);color:var(--terra-ink);white-space:nowrap;transition:transform .15s var(--ease)}
.qbtn:active{transform:scale(.94)}
.qbtn.ghost{background:var(--sand);color:var(--fg)}
.empty{padding:22px 0;text-align:center;color:var(--muted);font-size:14px}
.example{text-align:center;font-size:13px;color:var(--muted)}
.example button{color:var(--terra);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* Inventario */
.search{width:100%;height:46px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:0 14px;font:inherit;color:var(--fg)}
.group h3{margin:0 0 4px;font-family:var(--serif);font-size:22px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.group h3 small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400}
.group p{margin:0 0 10px}

/* Números */
.month{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
.month button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--terra)}
.month button:disabled{opacity:.3;cursor:default}
.month span{font-family:var(--serif);font-size:20px;font-weight:600}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi>div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);min-width:0}
.kpi>div.hl{background:var(--sand);border-color:var(--sand)}
.kpi .v{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin-top:4px}
.kpi .h{font-size:12.5px;color:var(--muted)}
.chart{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .8s var(--ease) both;cursor:pointer}
.insight{background:var(--sand-2);border-left:3px solid var(--terra);border-radius:4px 12px 12px 4px;padding:14px 16px;font-family:var(--serif);font-size:19px;line-height:1.35}
.insight b{color:var(--terra);font-weight:700}
.meter{display:flex;flex-direction:column;gap:6px;padding-block:9px}
.meter .k{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.meter .k span:last-child{font-weight:500}
.track{height:6px;background:var(--sand-2);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--terra);border-radius:6px;transform-origin:left;animation:fill .9s var(--ease) both}
.track i.w{background:var(--warn)} .track i.n{background:var(--neg)} .track i.g{background:var(--pos)}

/* Hacienda */
.status{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--sand);white-space:nowrap}
.status.w{background:color-mix(in srgb,var(--warn) 20%,var(--paper));color:var(--warn)}
.status.n{background:color-mix(in srgb,var(--neg) 16%,var(--paper));color:var(--neg)}
.kvs .kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kvs .kv:last-child{border-bottom:0}
.kvs .kv span:first-child{color:var(--muted)}
.kvs .kv.total{font-family:var(--serif);font-size:22px;font-weight:600}
.kvs .kv.total span:first-child{color:var(--fg)}

/* Botones */
.btn{height:52px;border-radius:12px;font-weight:500;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);transition:transform .15s var(--ease),background .2s;width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--terra);color:var(--terra-ink);border-color:var(--terra)}
.btn.sand{background:var(--sand);border-color:var(--sand)}
.btn.danger{color:var(--neg);background:none}

/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:12px;font-weight:500;color:var(--muted);position:relative;transition:color .2s}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-selected="true"]{color:var(--terra)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--terra);animation:grow2 .35s var(--ease) both}

/* Páginas */
.page{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:slideIn .34s var(--ease) both;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.page.out{animation:slideOut .26s var(--ease) both}
.pbar{flex:none;height:60px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.pbar .wrap{display:flex;align-items:center;gap:6px;width:100%}
.back{display:flex;align-items:center;gap:2px;color:var(--terra);font-weight:500;margin-left:-6px;padding:6px}
.back svg{width:20px;height:20px}
.pbody{flex:1;overflow:auto;padding-block:22px 28px}
.pbody .wrap{display:flex;flex-direction:column;gap:24px}
.pfoot{flex:none;border-top:1px solid var(--line);padding-block:12px;background:var(--paper)}
.pfoot .wrap{display:flex;gap:10px}
.ptitle{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;margin:0}
.form{display:flex;flex-direction:column;gap:22px}
.q{display:flex;flex-direction:column;gap:8px;min-width:0}
.q>label,.q>.lab{font-family:var(--serif);font-size:20px;font-weight:600}
.q .hint{font-size:13px;color:var(--muted);margin-top:-4px}
.q input{height:52px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:0 14px;font:inherit;font-size:17px;color:var(--fg);width:100%;min-width:0}
.money{position:relative}
.money input{padding-right:36px}
.money::after{content:"€";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.small label{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted)}
.small input{height:46px;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px;font-weight:500;transition:all .2s var(--ease)}
.opt[aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:var(--terra-ink)}
.photo{display:flex;align-items:center;gap:14px}
.photo .thumb{width:64px;height:64px;border:1px dashed var(--gold);background:var(--paper)}
.photo label{color:var(--terra);font-weight:500;cursor:pointer}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.result{background:var(--sand);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.result .v{font-family:var(--serif);font-size:36px;font-weight:700;line-height:1;transition:color .2s}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps div{border-top:2px solid var(--line);padding-top:8px;font-size:13px}
.steps div.on{border-color:var(--terra)}
.steps b{display:block;font-weight:500}
.steps span{color:var(--muted);font-size:12px}
.clockbig{font-family:var(--serif);font-size:72px;font-weight:600;text-align:center;line-height:1;padding-block:16px 4px}
textarea{width:100%;min-height:220px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg)}

/* Confirmación */
.done{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s ease both;padding:20px}
.done .box{background:var(--paper);border:1px solid var(--gold);border-radius:20px;padding:28px 30px;text-align:center;box-shadow:var(--sh);animation:pop .45s var(--ease) both;max-width:320px;width:100%}
.done .seal{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--terra);color:var(--terra-ink);display:grid;place-items:center}
.done .seal svg{width:30px;height:30px}
.done .seal path{stroke-dasharray:30;stroke-dashoffset:30;animation:tick .5s .2s var(--ease) forwards}
.done b{display:block;font-family:var(--serif);font-size:44px;font-weight:700;line-height:1;margin-block:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 40px);animation:toast .35s var(--ease) both}

@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideOut{to{transform:translateX(100%)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes grow2{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes tick{to{stroke-dashoffset:0}}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="mark"><div class="mono" aria-hidden="true"><span>F</span></div><div><div class="n">Flipa</div><div class="d" id="greet"></div></div></div>
  <div id="timerSlot"></div>
</div></header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="Secciones"><div class="wrap" id="tabs" role="tablist"></div></nav>
<div id="pageRoot"></div>
<div id="overlayRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
const KEY="flipa-v1",DAY=864e5;
const $=s=>document.querySelector(s);
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=new Date();today.setHours(0,0,0,0);
const iso=t=>{const x=new Date(t);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const ago=n=>iso(today.getTime()-n*DAY);
const toDate=s=>new Date(s+"T00:00:00");
const days=(a,b)=>Math.round((toDate(b)-toDate(a))/DAY);
const r2=n=>Math.round(n*100)/100;
const eur=n=>{n=r2(n);return n.toLocaleString("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2,useGrouping:"always"})};
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const uid=()=>Math.random().toString(36).slice(2,10);
const short=d=>toDate(d).toLocaleDateString("es-ES",{day:"numeric",month:"short"}).replace(".","");
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const monthName=(y,m)=>cap(new Date(y,m,1).toLocaleDateString("es-ES",{month:"long"}));
const CATS=["Ropa","Zapatillas","Electrónica","Accesorios","Libros","Juguetes","Hogar","Otros"];
const PLACES=["Rastro","Mercadillo","Tienda solidaria","Vinted","Wallapop","Mi armario","Otro"];
const PLATS=["Vinted","Wallapop","Otra"];
const GCATS=["Transporte","Embalaje","Destacados","Suscripciones","Otros"];
const ACTS=["Rastro","Fotos y anuncios","Envíos"];
const STATUS={stock:"Sin publicar",publicado:"En venta",vendido:"Vendido"};
const svg=(d,w)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const I={
  bag:svg("M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"),
  tag:svg("M3 12V4h8l10 10-8 8zM7.5 7.5h.01",1.7),
  receipt:svg("M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"),
  clock:svg("M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2"),
  home:svg("M4 11l8-7 8 7v9h-5v-6H9v6H4z"),
  box:svg("M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5zM3 7.5l9 4.5 9-4.5M12 12v9"),
  chart:svg("M4 20V10M10 20V4M16 20v-7M21 20H3"),
  bank:svg("M3 9l9-5 9 5M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"),

/* ---------- Cálculos ---------- */
const cost=it=>it.buy+(it.extra||0);
const saleCosts=it=>it.sale?(it.sale.ship+it.sale.fees+it.sale.pack):0;
const profit=it=>it.sale?it.sale.price-cost(it)-saleCosts(it):0;
const sold=()=>S.items.filter(i=>i.status==="vendido"&&i.sale);
const live=()=>S.items.filter(i=>i.status!=="vendido");
const inMonth=(d,y,m)=>{const x=toDate(d);return x.getFullYear()===y&&x.getMonth()===m};
const inYear=(d,y)=>toDate(d).getFullYear()===y;
const idleDays=it=>days(it.listed||it.buyDate,iso(today));
function month(y,m){
  const s=sold().filter(i=>inMonth(i.sale.date,y,m));
  const exp=S.expenses.filter(e=>inMonth(e.date,y,m)).reduce((a,e)=>a+e.eur,0);
  const min=s.reduce((a,i)=>a+(i.min||0),0)+S.sessions.filter(x=>inMonth(x.date,y,m)).reduce((a,x)=>a+x.min,0);
  const revenue=s.reduce((a,i)=>a+i.sale.price,0),gross=s.reduce((a,i)=>a+profit(i),0);
  return {s,net:gross-exp,gross,exp,min,revenue};
}
const perHour=(net,min)=>min>0?net/(min/60):0;
const hm=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return h?h+" h"+(m?" "+m+" min":""):m+" min"};
const shown={};
function countTo(el,key,to,fmt){
  if(!el)return;const from=key in shown?shown[key]:to*.5;shown[key]=to;
  if(RM||from===to){el.textContent=fmt(to);return}
  const t0=performance.now(),d=900;
  const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
  el.textContent=fmt(from);requestAnimationFrame(step);
}

function drawChart(){
  const pts=[];for(let k=5;k>=0;k--){const d=new Date(sel.y,sel.m-k,1);pts.push({y:d.getFullYear(),m:d.getMonth(),l:cap(d.toLocaleDateString("es-ES",{month:"short"}).replace(".","")),v:month(d.getFullYear(),d.getMonth()).net})}
  const W=440,H=190,top=26,bot=26,bw=W/6;
  const mx=Math.max(1,...pts.map(p=>p.v)),mn=Math.min(0,...pts.map(p=>p.v));
  const sc=v=>top+(mx-v)/(mx-mn)*(H-top-bot),zero=sc(0);
  let g="";
  pts.forEach((p,i)=>{const x=i*bw+bw*.22,w=bw*.56,y=sc(Math.max(0,p.v)),h=Math.max(2,Math.abs(sc(p.v)-zero)),on=i===5;
    g+=`<g data-y="${p.y}" data-m="${p.m}" class="pt"><rect x="${i*bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>`+
      `<rect class="bar" x="${x}" y="${p.v<0?zero:y}" width="${w}" height="${h}" rx="5" fill="${p.v<0?"var(--neg)":on?"var(--terra)":"var(--sand)"}" style="animation-delay:${i*70}ms;cursor:pointer"/>`+
      `<text x="${x+w/2}" y="${p.v<0?zero-7:y-8}" text-anchor="middle" font-size="12.5" font-family="var(--sans)" font-weight="${on?600:400}" fill="${on?"var(--fg)":"var(--muted)"}">${Math.round(p.v)} €</text>`+
      `<text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="12.5" font-family="var(--sans)" font-weight="${on?600:400}" fill="${on?"var(--terra)":"var(--muted)"}">${p.l}</text></g>`});
  g+=`<line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>`;
  $("#chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Beneficio neto de los últimos seis meses">${g}</svg>`;
}

function page(body,foot,bind,label){
  const el=document.createElement("div");el.className="page";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label",label||"Detalle");
  el.innerHTML=`<div class="pbar"><div class="wrap"><button type="button" class="back" data-back>${I.back}Volver</button></div></div><div class="pbody"><div class="wrap">${body}</div></div>${foot?`<div class="pfoot"><div class="wrap">${foot}</div></div>`:""}`;
  $("#pageRoot").appendChild(el);
  const close=cb=>{document.removeEventListener("keydown",onKey);if(RM){el.remove();cb&&cb();return}el.classList.add("out");el.addEventListener("animationend",()=>{el.remove();cb&&cb()},{once:true})};
  const onKey=e=>{if(e.key==="Escape"&&$("#pageRoot").lastChild===el)close()};
  document.addEventListener("keydown",onKey);
  el.addEventListener("click",e=>{if(e.target.closest("[data-back]"))close()});
  bind&&bind(el,close);
  return el;
}
const opts=(id,vals,cur)=>`<div class="opts" id="${id}">${vals.map(v=>`<button type="button" class="opt" data-v="${v}" aria-pressed="${v===cur}">${v}</button>`).join("")}</div>`;
function pick(el,id){const b=el.querySelector("#"+id);b.addEventListener("click",e=>{const x=e.target.closest("button");if(!x)return;b.querySelectorAll("button").forEach(y=>y.setAttribute("aria-pressed",String(y===x)))});return ()=>{const x=b.querySelector('[aria-pressed="true"]');return x?x.dataset.v:null}}
let tt;function toast(t){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(tt);tt=setTimeout(()=>r.innerHTML="",2400)}
function confirmDone(title,amount,cls,sub){
  const r=$("#overlayRoot");
  r.innerHTML=`<div class="done" role="status"><div class="box"><div class="seal">${I.ok}</div><div class="sc">${esc(title)}</div><b class="num ${cls||""}">${amount}</b><div class="note">${esc(sub||"")}</div></div></div>`;
  const off=()=>{r.innerHTML=""};r.firstChild.addEventListener("click",off);setTimeout(off,RM?1400:1900);
}
function resizePhoto(file,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=240,c=document.createElement("canvas"),k=Math.min(1,s/Math.max(img.width,img.height));c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};img.src=fr.result};fr.readAsDataURL(file)}

/* He comprado algo */
function openBuy(){
  let photo=null;
  page(`<h1 class="ptitle">He comprado algo</h1>
  <div class="form">
    <div class="q"><label for="aName">¿Qué es?</label><input id="aName" type="text" placeholder="Chaqueta vaquera Levi's"></div>
    <div class="q"><span class="lab">¿De qué tipo?</span>${opts("aCat",CATS,"Ropa")}</div>
    <div class="grid2">
      <div class="q"><label for="aBuy">¿Cuánto te costó?</label><div class="money"><input id="aBuy" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div></div>
      <div class="q"><label for="aTarget">¿Por cuánto lo venderás?</label><div class="money"><input id="aTarget" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div></div>
    </div>
    <div class="q"><span class="lab">¿Dónde lo encontraste?</span>${opts("aPlace",PLACES,"Rastro")}</div>
    <div class="grid2 small">
      <div class="q"><label for="aExtra">Limpieza o arreglo</label><div class="money"><input id="aExtra" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div></div>
      <div class="q"><label for="aDate">Fecha de compra</label><input id="aDate" type="date" value="${iso(today)}"></div>
    </div>
    <div class="photo"><span class="thumb" id="aThumb">+</span><div><label for="aPhoto">Añadir una foto</label><input id="aPhoto" type="file" accept="image/*"><div class="note">Opcional, para reconocerlo rápido</div></div></div>
    <div class="result"><span class="note" style="color:var(--fg)">Si lo vendes a ese precio ganarás</span><span class="v num" id="aGain">0 €</span></div>
  </div>`,
  `<button type="button" class="btn primary" id="aSave">Guardar en mi inventario</button>`,(el,close)=>{
    const cat=pick(el,"aCat"),place=pick(el,"aPlace"),v=s=>num(el.querySelector(s).value);
    const calc=()=>{const g=v("#aTarget")-v("#aBuy")-v("#aExtra"),o=el.querySelector("#aGain");o.textContent=eur(g);o.className="v num "+(g>=0?"pos":"neg")};
    el.addEventListener("input",calc);
    el.querySelector("#aPhoto").addEventListener("change",e=>{const f=e.target.files[0];if(f)resizePhoto(f,d=>{photo=d;el.querySelector("#aThumb").innerHTML=`<img src="${d}" alt="">`})});
    el.querySelector("#aSave").addEventListener("click",()=>{
      const name=el.querySelector("#aName").value.trim();
      if(!name){el.querySelector("#aName").focus();toast("Escribe qué has comprado");return}
      S.items.push({id:uid(),name,cat:cat(),buy:v("#aBuy"),target:v("#aTarget"),place:place(),buyDate:el.querySelector("#aDate").value||iso(today),extra:v("#aExtra"),min:0,status:"stock",platform:null,listed:null,sale:null,photo});
      S.example=false;save();close(()=>setView("inventario"));toast("Guardado en Sin publicar");
    });
  },"He comprado algo");
}

/* He vendido algo */
function openSellPicker(){
  const L=live().sort((a,b)=>(a.status==="publicado"?0:1)-(b.status==="publicado"?0:1));
  page(`<h1 class="ptitle">¿Qué has vendido?</h1><p class="note" style="margin-top:-12px">Elige el producto de tu inventario.</p>
    <input class="search" id="sq" type="search" placeholder="Buscar" aria-label="Buscar producto"><div id="sList"></div>`,"",(el,close)=>{
    const draw=()=>{const q=el.querySelector("#sq").value.trim().toLowerCase(),l=L.filter(i=>!q||i.name.toLowerCase().includes(q));
      el.querySelector("#sList").innerHTML=l.length?`<div class="list">${l.map(i=>`<button type="button" class="r" data-pick="${i.id}">${thumb(i)}<span><span class="t">${esc(i.name)}</span><span class="s">${STATUS[i.status]}${i.platform?" · "+i.platform:""}</span></span><span class="amt num">${eur(i.target||0)}<small>objetivo</small></span></button>`).join("")}</div>`:`<div class="empty">No tienes productos sin vender. Añade uno desde "He comprado algo".</div>`};
    draw();el.querySelector("#sq").addEventListener("input",draw);
    el.querySelector("#sList").addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b)openSell(S.items.find(i=>i.id===b.dataset.pick),()=>close())});
  },"¿Qué has vendido?");
}
function openSell(it,onDone){
  page(`<div style="display:flex;gap:14px;align-items:center">${thumb(it)}<div style="min-width:0"><h1 class="ptitle" style="font-size:26px">${esc(it.name)}</h1><div class="note">Te costó ${eur(cost(it))}</div></div></div>
  <div class="form">
    <div class="q"><label for="sPrice">¿Por cuánto lo has vendido?</label><div class="money"><input id="sPrice" type="number" inputmode="decimal" min="0" step="0.01" value="${it.target||""}" placeholder="0"></div></div>
    <div class="q"><span class="lab">¿Dónde?</span>${opts("sPlat",PLATS,it.platform||"Vinted")}</div>
    <div class="q"><span class="lab">¿Has pagado tú algo más?</span><div class="hint">Déjalo en 0 si lo pagó el comprador.</div>
      <div class="grid3 small">
        <div class="q"><label for="sShip">Envío</label><div class="money"><input id="sShip" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div></div>
        <div class="q"><label for="sFees">Comisión</label><div class="money"><input id="sFees" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div></div>
        <div class="q"><label for="sPack">Embalaje</label><div class="money"><input id="sPack" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div></div>
      </div></div>
    <div class="result"><span class="note" style="color:var(--fg)">Ganas de verdad</span><span class="v num" id="sProfit"></span></div>
  </div>`,`<button type="button" class="btn primary" id="sSave">Guardar venta</button>`,(el,close)=>{
    const plat=pick(el,"sPlat"),v=s=>num(el.querySelector(s).value);
    const calc=()=>{const p=v("#sPrice")-cost(it)-v("#sShip")-v("#sFees")-v("#sPack"),o=el.querySelector("#sProfit");o.textContent=eur(p);o.className="v num "+(p>=0?"pos":"neg");return p};
    el.addEventListener("input",calc);calc();
    el.querySelector("#sSave").addEventListener("click",()=>{
      if(v("#sPrice")<=0){el.querySelector("#sPrice").focus();toast("Escribe el precio de venta");return}
      const p=calc();
      it.status="vendido";it.platform=plat();it.listed=it.listed||it.buyDate;
      it.sale={price:v("#sPrice"),date:el.querySelector("#sDate")?el.querySelector("#sDate").value:iso(today),ship:v("#sShip"),fees:v("#sFees"),pack:v("#sPack")};
      S.example=false;save();
      close(()=>{onDone&&onDone();setView("inicio")});
      confirmDone("Venta guardada",(p>=0?"+":"")+eur(p),p>=0?"pos":"neg",p>=0?"Ya está sumado a tu mes":"Esta venta te ha costado dinero");
    });
  },"Registrar venta");
}

/* Publicar */
function openPublish(it){
  page(`<h1 class="ptitle">Publicar</h1><p class="note" style="margin-top:-12px">${esc(it.name)}</p>
    <div class="form"><div class="q"><span class="lab">¿Dónde lo has anunciado?</span>${opts("pPlat",PLATS,"Vinted")}</div>
    <div class="q"><label for="pPrice">¿A qué precio?</label><div class="money"><input id="pPrice" type="number" inputmode="decimal" min="0" step="0.01" value="${it.target||""}"></div></div></div>`,
  `<button type="button" class="btn primary" id="pSave">Marcar como en venta</button>`,(el,close)=>{
    const plat=pick(el,"pPlat");
    el.querySelector("#pSave").addEventListener("click",()=>{it.status="publicado";it.platform=plat();it.listed=iso(today);const p=num(el.querySelector("#pPrice").value);if(p>0)it.target=p;S.example=false;save();close(render);toast("En venta en "+it.platform)});
  },"Publicar");
}

/* Ficha */
function openItem(id){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  const isSold=it.status==="vendido",p=profit(it);
  const steps=[["Comprado",it.buyDate,true],["En venta",it.listed,it.status!=="stock"],["Vendido",it.sale&&it.sale.date,isSold]];
  page(`<div style="display:flex;gap:14px;align-items:center">${thumb(it)}<div style="min-width:0"><h1 class="ptitle" style="font-size:28px">${esc(it.name)}</h1><div class="note">${esc(it.cat)} · encontrado en ${esc(it.place||"–")}</div></div></div>
    <div class="steps">${steps.map(([l,d,on])=>`<div class="${on?"on":""}"><b>${l}</b><span>${on&&d?short(d):"—"}</span></div>`).join("")}</div>
    ${isSold?`<div class="result"><span class="note" style="color:var(--fg)">Te ha dejado</span><span class="v num ${p>=0?"pos":"neg"}">${p>=0?"+":""}${eur(p)}</span></div>`:""}
    <div class="list kvs" style="padding-block:4px">
      <div class="kv"><span>Te costó</span><span class="num">${eur(it.buy)}</span></div>
      ${it.extra?`<div class="kv"><span>Limpieza o arreglo</span><span class="num">${eur(it.extra)}</span></div>`:""}
      ${isSold?`<div class="kv"><span>Lo vendiste en ${esc(it.platform)} por</span><span class="num">${eur(it.sale.price)}</span></div>${saleCosts(it)?`<div class="kv"><span>Envío, comisión y embalaje</span><span class="num">−${eur(saleCosts(it))}</span></div>`:""}${it.min?`<div class="kv"><span>Por hora dedicada</span><span class="num">${eur(perHour(p,it.min))}</span></div>`:""}`
      :`<div class="kv"><span>Quieres venderlo por</span><span class="num">${eur(it.target||0)}</span></div><div class="kv"><span>Ganarías</span><span class="num pos">${eur((it.target||0)-cost(it))}</span></div><div class="kv"><span>Lleva sin venderse</span><span class="num ${idleDays(it)>=30?"warn":""}">${idleDays(it)} días</span></div>`}
    </div>
    <div class="q"><span class="lab" style="font-size:18px">Tiempo dedicado · <span class="num" id="iMin">${hm(it.min||0)}</span></span><div class="opts" id="iTime"><button type="button" class="opt" data-m="5">+5 min</button><button type="button" class="opt" data-m="15">+15 min</button><button type="button" class="opt" data-m="30">+30 min</button><button type="button" class="opt" data-m="0">Poner a cero</button></div></div>
    <button type="button" class="btn danger" id="iDel">Eliminar producto</button>`,
  isSold?`<button type="button" class="btn" id="iReturn">Me lo han devuelto</button>`
    :it.status==="stock"?`<button type="button" class="btn" id="iPub">Publicar</button><button type="button" class="btn primary" id="iSell">Lo he vendido</button>`
    :`<button type="button" class="btn" id="iUnpub">Quitar anuncio</button><button type="button" class="btn primary" id="iSell">Lo he vendido</button>`,
  (el,close)=>{
    const q=s=>el.querySelector(s);
    q("#iTime").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;const m=+b.dataset.m;it.min=m?(it.min||0)+m:0;S.example=false;save();q("#iMin").textContent=hm(it.min);render()});
    if(q("#iPub"))q("#iPub").addEventListener("click",()=>close(()=>openPublish(it)));
    if(q("#iSell"))q("#iSell").addEventListener("click",()=>openSell(it,()=>close()));
    if(q("#iUnpub"))q("#iUnpub").addEventListener("click",()=>{it.status="stock";it.platform=null;it.listed=null;save();close(render);toast("Anuncio quitado")});
    if(q("#iReturn"))q("#iReturn").addEventListener("click",()=>{it.status="stock";it.sale=null;it.listed=null;it.platform=null;save();close(render);toast("Vuelve a Sin publicar")});
    const del=q("#iDel");del.addEventListener("click",()=>{if(del.dataset.armed){S.items=S.items.filter(i=>i!==it);save();close(render);toast("Producto eliminado")}else{del.dataset.armed="1";del.textContent="Pulsa otra vez para eliminar"}});
  },"Producto");
}

/* Gasto */
function openExpense(){
  page(`<h1 class="ptitle">He tenido un gasto</h1><p class="note" style="margin-top:-12px">Lo que no es de un producto concreto. Se resta de lo que ganas en el mes.</p>
  <div class="form">
    <div class="q"><label for="gConcept">¿En qué?</label><input id="gConcept" type="text" placeholder="Gasolina para el rastro"></div>
    <div class="q"><span class="lab">Tipo</span>${opts("gCat",GCATS,"Transporte")}</div>
    <div class="grid2"><div class="q"><label for="gAmount">¿Cuánto?</label><div class="money"><input id="gAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div></div>
    <div class="q small"><label for="gDate">Fecha</label><input id="gDate" type="date" value="${iso(today)}"></div></div>
  </div>`,`<button type="button" class="btn primary" id="gSave">Guardar gasto</button>`,(el,close)=>{
    const cat=pick(el,"gCat");
    el.querySelector("#gSave").addEventListener("click",()=>{
      const c=el.querySelector("#gConcept").value.trim(),a=num(el.querySelector("#gAmount").value);
      if(!c){el.querySelector("#gConcept").focus();toast("Escribe en qué has gastado");return}
      if(a<=0){el.querySelector("#gAmount").focus();toast("Escribe el importe");return}
      S.expenses.push({id:uid(),concept:c,cat:cat(),eur:a,date:el.querySelector("#gDate").value||iso(today)});
      S.example=false;save();close(render);toast("Gasto guardado");
    });
  },"Gasto");
}

/* Tiempo */
let tk;
const fmtClock=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function renderTimer(){
  clearInterval(tk);const slot=$("#timerSlot");
  if(S.timer){const upd=()=>{slot.innerHTML=`<button type="button" class="timerpill" data-do="timer"><i></i><span class="num">${fmtClock(Date.now()-S.timer.start)}</span></button>`;const b=document.getElementById("clockBig");if(b)b.textContent=fmtClock(Date.now()-S.timer.start)};upd();tk=setInterval(upd,1000)}
  else slot.innerHTML="";
}
function openTimer(){
  const y=today.getFullYear(),m=today.getMonth(),run=!!S.timer;
  const recent=S.sessions.filter(s=>inMonth(s.date,y,m)).sort((a,b)=>b.date.localeCompare(a.date));
  page(`<h1 class="ptitle">${run?"Midiendo tu tiempo":"Medir mi tiempo"}</h1>
    <div class="clockbig num" id="clockBig">${run?fmtClock(Date.now()-S.timer.start):"00:00:00"}</div>
    ${run?`<p class="note" style="text-align:center">${esc(S.timer.label)}. Puedes cerrar esta pantalla: sigue contando.</p>`:`<div class="q"><span class="lab">¿Qué vas a hacer?</span>${opts("tAct",ACTS,"Rastro")}</div><p class="note">Así sabrás cuánto ganas de verdad por cada hora.</p>`}
    <section><div class="sechead"><h2 style="font-size:22px">Este mes</h2><span class="sc">${hm(recent.reduce((a,s)=>a+s.min,0))}</span></div>
    ${recent.length?`<div class="list">${recent.map(s=>`<div class="r plain"><span><span class="t">${esc(s.label)}</span><span class="s">${short(s.date)}</span></span><span class="amt num">${hm(s.min)}</span></div>`).join("")}</div>`:`<p class="note">Aún no has medido tiempo este mes.</p>`}</section>`,
  run?`<button type="button" class="btn primary" id="tStop">Parar y guardar</button>`:`<button type="button" class="btn primary" id="tStart">Empezar a contar</button>`,(el,close)=>{
    if(run)el.querySelector("#tStop").addEventListener("click",()=>{const min=Math.max(1,Math.round((Date.now()-S.timer.start)/60000));S.sessions.push({id:uid(),label:S.timer.label,min,date:iso(today)});S.timer=null;S.example=false;save();close(render);toast(hm(min)+" guardados")});
    else{const act=pick(el,"tAct");el.querySelector("#tStart").addEventListener("click",()=>{S.timer={start:Date.now(),label:act()};save();close(render);toast("Contando tiempo")})}
  },"Tiempo");
}

/* Exportar */
function csv(){
  const q=v=>{v=v==null?"":String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const dec=n=>n==null?"":String(r2(n)).replace(".",",");
  const rows=[["Producto","Categoría","Estado","Plataforma","Comprado en","Fecha compra","Precio compra","Limpieza/arreglo","Fecha venta","Precio venta","Envío","Comisiones","Embalaje","Beneficio","Minutos"]];
  S.items.forEach(i=>rows.push([i.name,i.cat,STATUS[i.status],i.platform||"",i.place||"",i.buyDate,dec(i.buy),dec(i.extra||0),i.sale?i.sale.date:"",i.sale?dec(i.sale.price):"",i.sale?dec(i.sale.ship):"",i.sale?dec(i.sale.fees):"",i.sale?dec(i.sale.pack):"",i.sale?dec(profit(i)):"",i.min||0]));
  rows.push([]);rows.push(["Gasto general","Tipo","Fecha","Importe"]);
  S.expenses.forEach(e=>rows.push([e.concept,e.cat,e.date,dec(e.eur)]));
  return rows.map(r=>r.map(q).join(";")).join("\n");
}
function openExport(){
  page(`<h1 class="ptitle">Exportar</h1><p class="note" style="margin-top:-12px">Copia el texto y pégalo en Excel, Google Sheets o mándaselo a tu gestor.</p><textarea id="csvBox" readonly aria-label="Datos en CSV">${esc(csv())}</textarea>`,
  `<button type="button" class="btn primary" id="copyCsv">Copiar</button>`,el=>{
    el.querySelector("#copyCsv").addEventListener("click",()=>{const ta=el.querySelector("#csvBox"),fb=()=>{ta.focus();ta.select();toast("Texto seleccionado. Cópialo desde el menú")};try{navigator.clipboard.writeText(ta.value).then(()=>toast("Copiado"),fb)}catch(e){fb()}});
  },"Exportar");
}

/* ---------- Eventos ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest(".page,.done"))return;
  const t=e.target.closest("[data-tab]");if(t){if(t.dataset.tab!==view)setView(t.dataset.tab);return}
  const d=e.target.closest("[data-do]");if(d){({buy:openBuy,sell:openSellPicker,expense:openExpense,timer:openTimer})[d.dataset.do]();return}
  const pub=e.target.closest("[data-pub]");if(pub){openPublish(S.items.find(i=>i.id===pub.dataset.pub));return}
  const sd=e.target.closest("[data-sold]");if(sd){openSell(S.items.find(i=>i.id===sd.dataset.sold));return}
  const cut=e.target.closest("[data-cut]");if(cut){const it=S.items.find(i=>i.id===cut.dataset.cut),k=idleDays(it)>=60?.8:.9;it.target=Math.round((it.target||cost(it))*k);it.listed=iso(today);S.example=false;save();render();toast("Rebajado a "+eur(it.target));return}
  const de=e.target.closest("[data-delexp]");if(de){if(de.dataset.armed){S.expenses=S.expenses.filter(x=>x.id!==de.dataset.delexp);save();render();toast("Gasto quitado")}else{de.dataset.armed="1";de.textContent="¿Seguro?"}return}
  if(e.target.closest("#exportBtn")){openExport();return}
  if(e.target.closest("#mPrev")){sel=sel.m===0?{y:sel.y-1,m:11}:{y:sel.y,m:sel.m-1};render();return}
  if(e.target.closest("#mNext")){sel=sel.m===11?{y:sel.y+1,m:0}:{y:sel.y,m:sel.m+1};render();return}
  const pt=e.target.closest(".pt");if(pt){sel={y:+pt.dataset.y,m:+pt.dataset.m};render();return}
  const cl=e.target.closest("#clearBtn");if(cl){if(cl.dataset.armed){S={items:[],expenses:[],sessions:[],timer:null,example:false};save();render();toast("Listo. Empieza con «He comprado algo»")}else{cl.dataset.armed="1";cl.textContent="Pulsa otra vez para borrar"}return}
  const it=e.target.closest("[data-item]");if(it){openItem(it.dataset.item);return}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-item][role=button]")){e.preventDefault();openItem(e.target.dataset.item)}});
render();
})();
</script>
